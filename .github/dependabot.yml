version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The source generator loads inside the consumer's compiler process, so its
      # Microsoft.CodeAnalysis.* reference is a COMPATIBILITY FLOOR, not a normal
      # dependency: compiling against a newer Roslyn than the consumer's SDK ships
      # makes the generator fail to load (CS9057, see PR #23). Bump these only as a
      # deliberate decision to drop support for older SDKs.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # gitsubmodule intentionally omitted — fixtures/v0.1 and fixtures/v0.2 are
  # pinned to specific upstream spec-version tags and must be updated manually.
  # Dependabot cannot distinguish the two version-pinned submodules from the
  # same huml-lang/tests repo and would propose semantically incorrect bumps.
